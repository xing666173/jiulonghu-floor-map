*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, canvas:focus-visible { outline: 2px solid #267955; outline-offset: 4px; }

.site-name { position: absolute; left: clamp(26px, 5.6vw, 96px); top: clamp(22px, 4.6vh, 48px); z-index: 2; display: flex; gap: 11px; align-items: center; color: #2f5147; font-size: .9rem; font-weight: 660; pointer-events: none; }
.separator { width: 3px; height: 3px; border-radius: 50%; background: #759387; }
.emblem { position: relative; display: inline-block; width: 28px; height: 27px; margin-right: 2px; }
.emblem i { position: absolute; width: 18px; height: 12px; left: 5px; transform: rotate(-20deg) skew(27deg, 6deg); border: 1px solid #3f7861; border-radius: 1.2px; }

.emblem i:nth-child(2) { top: 7px; opacity: .65; }

#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#map:focus-visible { outline-offset: -5px; }
#map.pointer { cursor: pointer; }
.stage[data-view="plan"] #map.dragging { cursor: grabbing; }

.intro { position: absolute; left: clamp(32px, 7.6vw, 132px); top: 50%; transform: translateY(-53%); z-index: 1; pointer-events: none; transition: opacity 300ms ease, transform 540ms cubic-bezier(.2,.8,.2,1), visibility 300ms; }
.intro .scope, .intro h1, .intro .instruction { animation: enter-copy 870ms cubic-bezier(.2,.75,.3,1) both; }
.intro h1 { animation-delay: 75ms; }
.intro .instruction { animation-delay: 205ms; }
@keyframes enter-copy { from { opacity: 0; transform: translateY(19px); } to { opacity: 1; transform: translateY(0); } }
.scope { display: flex; gap: 10px; align-items: center; margin: 0 0 15px; color: #507266; font-size: .93rem; font-weight: 650; letter-spacing: .055em; }
.scope span { width: 4px; height: 4px; border-radius: 50%; background: #729284; }

.stage[data-view="plan"] .intro { opacity: 0; transform: translate(-13px, -53%); visibility: hidden; }

.focus-title { position: absolute; left: clamp(32px, 7.6vw, 132px); top: clamp(94px, 17.5vh, 175px); z-index: 1; pointer-events: none; visibility: hidden; opacity: 0; transform: translateY(10px); transition: opacity 240ms ease, transform 480ms ease, visibility 240ms; }

.focus-title h2 { margin: 0; color: #173d30; font-size: clamp(2rem, 4.3vw, 4rem); line-height: 1.05; letter-spacing: -.04em; font-weight: 730; white-space: nowrap; }

.floor-navigation { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.floor-tag { position: absolute; top: 0; left: 0; display: flex; align-items: baseline; justify-content: center; gap: 3px; min-width: 53px; min-height: 31px; padding: 3px 7px; border-radius: 7px; border: 1px solid #b0cab9; background: #f3faf2; color: #265a45; font-size: .96rem; font-weight: 740; line-height: 1.3; font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: auto; box-shadow: 0 1px 4px #2e583a0a; }

    ctx.fillRect(x, y, right - x, bottom - y);
  }

function path(ctx, points) {

  ctx.moveTo(points[0].x, points[0].y);
  for (const point of points.slice(1)) ctx.lineTo(point.x, point.y);
  ctx.closePath();
}

function label(ctx, value, x, y, length, color, weight = 550, align = 'center') {

  ctx.textBaseline = 'middle';

  const [a, b, c, d, e, f] = transform;
  const x = point.x - e;
  const y = point.y - f;
  const determinant = a * d - b * c;
  return { x: (d * x - c * y) / determinant, y: (a * y - b * x) / determinant };
}

function corners(transform) {
  const [x, y, r, b] = sheet;
  return [project(transform, x, y), project(transform, r, y), project(transform, r, b), project(transform, x, b)];
}

function volume(level, transform, pose) {
  const points = corners(transform);
  const depth = Math.max(1.45, pose.scale * 5.7) * pose.plate;
  const sunk = points.map((point) => ({ x: point.x, y: point.y + depth }));
  const [top, face, edge] = angledColors[level - 1];
  ctx.save();
  ctx.globalAlpha = pose.alpha * pose.plate;
  for (const [a, b, fill] of [[1, 2, edge], [2, 3, face]]) {
    path(ctx, [points[a], points[b], sunk[b], sunk[a]]);
    ctx.fillStyle = fill;
    ctx.fill();
  }
  path(ctx, points);
  const shade = ctx.createLinearGradient(points[0].x, points[0].y, points[2].x, points[2].y);
  shade.addColorStop(0, '#f0f9e8');
  shade.addColorStop(1, top);
  ctx.fillStyle = shade;
  ctx.fill();
  ctx.strokeStyle = hover === level ? '#236443' : edge;
  ctx.lineWidth = hover === level ? 1.7 : .87;
  ctx.stroke();
  ctx.restore();
}

function drawLayer(level, pose) {
  if (pose.alpha < .015 || pose.scale < .015) return;
  const transform = matrix(pose);
  if (pose.plate > .01) volume(level, transform, pose);
  ctx.save();
  ctx.transform(...transform);
  if (pose.plate > .012) {
    ctx.globalAlpha = pose.alpha * pose.plate * (pose.scale < .38 ? .56 : .89);
    ctx.drawImage(geometry(level, false), 0, 0, 297, 379);
  }
  if (pose.detail > .01) {
    ctx.globalAlpha = pose.alpha * pose.detail;
    ctx.drawImage(geometry(level, true), 0, 0, 297, 379);
    planLabels(level, pose.scale);
  }
  ctx.restore();
}

function overviewTargets() {
  const { width, height } = size;
  const wide = width > 860;
  const xStart = wide ? width * .355 : (width <= 450 ? 11 : 25);
  const xEnd = width - (wide ? clamp(width * .083, 78, 140) : (width <= 450 ? 57 : 87));
  const upper = wide ? clamp(height * .115, 76, 118) : (width <= 450 ? 201 : 244);
  const lower = height - (wide ? clamp(height * .07, 41, 77) : 25);
  const spacing = wide ? clamp(height * .065, 33, 68) : (width <= 450 ? clamp(height * .061, 30, 48) : 49);
  const modelWidth = (sheet[2] - sheet[0] + sheet[3] - sheet[1]) * Math.SQRT1_2;
  const modelHeight = (sheet[2] - sheet[0] + sheet[3] - sheet[1]) / 2;
  const scale = Math.max(.22, Math.min((xEnd - xStart) / modelWidth, (lower - upper - 4 * spacing) / modelHeight));
  return layers.map((level) => ({ x: (xStart + xEnd) / 2, y: (upper + lower) / 2 + (3 - level) * spacing,
    scale, azimuth: 45, elevation: 45, plate: 1, detail: 0, alpha: 1 }));
}

function planTargets(level) {
  const { width, height } = size;
  const wide = width > 860;
  const small = width <= 450;
  const left = wide ? clamp(width * .235, 177, 330) : 15;
  const right = width - (wide ? (width > 1150 ? 225 : 179) : 15);
  const top = wide ? 71 : (small ? 224 : 223);
  const bottom = height - (small ? 70 : 66);
  const base = Math.max(.23, Math.min((right - left) / 282, (bottom - top) / 355));
  const centerX = wide ? width - (width > 1150 ? 130 : 106) : width - (small ? 88 : 106);
  const centerY = wide ? 147 : (small ? 125 : 136);
  const miniScale = wide ? (width > 1150 ? .255 : .21) : (small ? .175 : .225);
  const others = layers.filter((floor) => floor !== level);
  return layers.map((floor) => {
    if (floor === level) return { x: (left + right) / 2 + camera.x, y: (top + bottom) / 2 + camera.y,
      scale: base * camera.zoom, azimuth: 0, elevation: 90, plate: 0, detail: 1, alpha: 1 };
    return { x: centerX, y: centerY + (1.5 - others.indexOf(floor)) * (small ? 23 : 27),
      scale: miniScale, azimuth: 45, elevation: 31, plate: 1, detail: 0, alpha: 1 };
  });
}

function targets() {
  return active === null ? overviewTargets() : planTargets(active);
}

function paintOrder() {
  if (active === null) return layers;
  const others = layers.filter((level) => level !== active);
  if (transition) return poses[active - 1].detail < .45 ? layers : [...others, active];
  return [active, ...others];
}

function overviewGuides() {
  const first = poses[0];
  const fifth = poses[4];
  const amount = Math.min(first.alpha, fifth.alpha);
  if (amount < .05) return;
  const lower = corners(matrix(first));
  const upper = corners(matrix(fifth));
  ctx.save();
  ctx.globalAlpha = amount;
  ctx.strokeStyle = '#89b29c66';
  ctx.lineWidth = .85;
  ctx.setLineDash([2.5, 4.5]);
  for (const corner of [0, 1, 3]) {
    ctx.beginPath();
    ctx.moveTo(upper[corner].x, upper[corner].y);
    ctx.lineTo(lower[corner].x, lower[corner].y);
    ctx.stroke();
  }
  ctx.restore();
  const at = lower[2].y + first.scale * 10;
  const radius = (lower[1].x - lower[3].x) * .47;
  const shadow = ctx.createRadialGradient(first.x, 0, 1, first.x, 0, radius);
  shadow.addColorStop(0, '#37674933');
  shadow.addColorStop(.65, '#45775612');
  shadow.addColorStop(1, '#45775600');
  ctx.save();
  ctx.globalAlpha = first.alpha;
  ctx.translate(0, at);
  ctx.scale(1, .15);
  ctx.fillStyle = shadow;
  ctx.fillRect(first.x - radius, -radius, radius * 2, radius * 2);
  ctx.restore();
}

function positionTags() {
  const inPlan = active !== null;
  const small = size.width <= 450;
  const wide = size.width > 860;
  const buttonWidth = inPlan ? (small ? 31 : 37) : (small ? 39 : 53);
  const buttonHeight = inPlan ? (small ? 19 : 22) : (small ? 25 : 31);
  for (const button of tags) {
    const level = Number(button.dataset.floor);
    const pose = poses[level - 1];
    button.hidden = level === active;
    button.classList.toggle('highlight', level === hover);
    if (button.hidden) continue;
    const anchor = corners(matrix(pose))[1];
    const x = clamp(anchor.x + (inPlan ? 6 : 12), 6, size.width - buttonWidth - (small ? 7 : 16));
    const y = anchor.y - buttonHeight / 2;
    button.style.transform = `translate(${x}px,${y}px)`;
    button.style.opacity = pose.alpha;
    if (pose.alpha > .1 && x > anchor.x + 2) {
      ctx.strokeStyle = '#66957d99';
      ctx.lineWidth = .8;
      ctx.beginPath();
      ctx.moveTo(anchor.x + 1, anchor.y);
      ctx.lineTo(x, anchor.y);
      ctx.stroke();
    }
  }
  overviewLink.style.right = `${small ? 18 : wide ? 40 : 23}px`;
  overviewLink.style.top = `${small ? 48 : wide ? 46 : 61}px`;
}

function draw() {
  if (!poses.length) return;
  ctx.setTransform(size.pixel, 0, 0, size.pixel, 0, 0);
  ctx.clearRect(0, 0, size.width, size.height);
  if (active === null) overviewGuides();
  const order = paintOrder();
  for (const level of order) drawLayer(level, poses[level - 1]);
  positionTags();
}

function animatedPose(from, to, amount) {
  const result = {};
  for (const name of Object.keys(to)) result[name] = lerp(from[name], to[name], amount);
  return result;
}

function renderFrame(now) {
  lastFrameRequest = 0;
  if (transition) {
    const elapsed = now - transition.start;
    poses = transition.to.map((to, index) => {
      const progress = clamp((elapsed - index * transition.stagger) / transition.duration, 0, 1);
      return animatedPose(transition.from[index], to, ease(progress));
    });
    if (elapsed >= transition.duration + 4 * transition.stagger) {
      poses = transition.to;
      transition = null;
      stage.dataset.motion = 'idle';
    }
  }
  draw();
  if (transition) requestDraw();
}

function requestDraw() {
  if (!lastFrameRequest) lastFrameRequest = requestAnimationFrame(renderFrame);
}

function move(to, intro = false) {
  const from = intro ? to.map((pose, i) => ({ ...pose,
    y: lerp(pose.y, to[0].y + 21, .57) + i * 2.2, scale: pose.scale * .90, elevation: 36, alpha: 0 })) : poses;
  if (reduced.matches) {
    poses = to;
    transition = null;
    stage.dataset.motion = 'idle';
  } else {
    transition = { from, to, start: performance.now(), duration: intro ? 770 : 720, stagger: intro ? 68 : 0 };
    poses = from;
    stage.dataset.motion = intro ? 'entering' : 'transitioning';
  }
  requestDraw();
}

function hideRoom() {
  roomNote.hidden = true;
  selectedRoom = null;
}

function choose(level, focusCanvas = false) {
  if (level === active || !poses.length) return;
  hideRoom();
  hover = null;
  active = level;
  camera.zoom = 1;
  camera.x = 0;
  camera.y = 0;
  stage.dataset.view = level === null ? 'overview' : 'plan';
  document.querySelector('#intro').setAttribute('aria-hidden', level !== null);
  document.querySelector('#focus-title').setAttribute('aria-hidden', level === null);
  document.querySelector('#floor-name').textContent = level === null ? '' : `${level} 层`;
  legend.setAttribute('aria-hidden', level === null);
  for (const node of legend.querySelectorAll('[data-service]')) node.hidden = level !== 1;
  legend.querySelector('[data-large]').hidden = level === 5;
  overviewLink.hidden = level === null;
  canvas.setAttribute('aria-label', level === null ? '五层斜视总图' : `${level} 层平面图，可拖动平移或用滚轮缩放`);
  move(targets());
  if (focusCanvas) {
    if (level === null) tags[0].focus({ preventScroll: true });
    else canvas.focus({ preventScroll: true });
  }
}

function resize() {
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  const pixel = Math.min(devicePixelRatio || 1, 2.5);
  if (!width || !height || (width === size.width && height === size.height && pixel === size.pixel)) return;
  size = { width, height, pixel };
  canvas.width = Math.round(width * pixel);
  canvas.height = Math.round(height * pixel);
  if (!poses.length) move(targets(), true);
  else if (transition) move(targets());
  else {
    poses = targets();
    requestDraw();
  }
}

function localPoint(event) {
  const bounds = canvas.getBoundingClientRect();
  return { x: event.clientX - bounds.left, y: event.clientY - bounds.top };
}

function inRect(point, [left, top, right, bottom]) {
  return point.x >= left && point.x <= right && point.y >= top && point.y <= bottom;
}

function floorAt(point) {
  for (const level of [...paintOrder()].reverse()) {
    if (level === active) continue;
    const pose = poses[level - 1];
    if (pose.alpha > .44 && inRect(unproject(matrix(pose), point), sheet)) return level;
  }
  return null;
}

function showRoom(point) {
  const map = maps[active - 1];
  const origin = unproject(matrix(poses[active - 1]), point);
  const matches = map.labels.filter((item) => inRect(origin, item));
  const area = ([x, y, r, b]) => (r - x) * (b - y);
  const hit = matches.sort((a, b) => area(a) - area(b))[0];
  const device = map.symbols.find(([, x, y, r]) => Math.hypot(x - origin.x, y - origin.y) <= r + 1.3);
  if (!hit && !device) hideRoom();
  else {
    selectedRoom = hit || null;
    document.querySelector('#room-name').textContent = hit ? hit[4].join(' · ') : (device[0] === 'printer' ? '打印机' : '售卖机');
    roomNote.hidden = false;
    const x = clamp(point.x + 13, 12, size.width - roomNote.offsetWidth - 12);
    const y = clamp(point.y - roomNote.offsetHeight - 10, 12, size.height - roomNote.offsetHeight - 12);
    roomNote.style.transform = `translate(${x}px,${y}px)`;
  }
  requestDraw();
}

function updateCamera() {
  hideRoom();
  poses = targets();
  requestDraw();
}

function zoom(factor, anchor = null) {
  if (active === null || transition) return;
  const before = poses[active - 1];
  camera.zoom = clamp(camera.zoom * factor, .8, 5);
  if (anchor) {
    const after = targets()[active - 1];
    const ratio = after.scale / before.scale;
    camera.x += (anchor.x - before.x) * (1 - ratio);
    camera.y += (anchor.y - before.y) * (1 - ratio);
  }
  updateCamera();
}

for (const tag of tags) {
  const level = Number(tag.dataset.floor);
  tag.addEventListener('click', (event) => choose(level, event.detail === 0));
  tag.addEventListener('pointerenter', () => { hover = level; requestDraw(); });
  tag.addEventListener('pointerleave', () => { if (hover === level) hover = null; requestDraw(); });
}
overviewLink.addEventListener('click', (event) => choose(null, event.detail === 0));
document.querySelector('#dismiss-note').addEventListener('click', () => { hideRoom(); requestDraw(); });

let drag = null;
let pinch = null;
const touches = new Map();

function touchPair() {
  const [a, b] = touches.values();
  const point = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  return { point, distance: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)) };
}

canvas.addEventListener('pointerdown', (event) => {
  if (!poses.length || event.button !== 0) return;
  const point = localPoint(event);
  if (event.pointerType === 'touch' && active !== null && !transition) {
    touches.set(event.pointerId, point);
    if (touches.size >= 2) {
      pinch = touchPair();
      drag = null;
      canvas.classList.remove('dragging');
      canvas.setPointerCapture(event.pointerId);
      return;
    }
  }
  if (!event.isPrimary) return;
  drag = { point, floor: floorAt(point), x: camera.x, y: camera.y, moved: false, id: event.pointerId };
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove', (event) => {
  if (!poses.length) return;
  const point = localPoint(event);
  if (touches.has(event.pointerId)) {
    touches.set(event.pointerId, point);
    if (pinch) {
      const next = touchPair();
      camera.x += next.point.x - pinch.point.x;
      camera.y += next.point.y - pinch.point.y;
      poses = targets();
      zoom(next.distance / pinch.distance, next.point);
      pinch = next;
      return;
    }
  }
  if (drag?.id === event.pointerId && active !== null && drag.floor === null && !transition) {
    const dx = point.x - drag.point.x;
    const dy = point.y - drag.point.y;
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    drag.moved = true;
    canvas.classList.add('dragging');
    camera.x = drag.x + dx;
    camera.y = drag.y + dy;
    updateCamera();
    return;
  }
  const level = floorAt(point);
  if (level !== hover) { hover = level; requestDraw(); }
  canvas.classList.toggle('pointer', level !== null);
});
canvas.addEventListener('pointerleave', () => { if (!drag) { hover = null; requestDraw(); } });
function releaseTouch(event) {
  if (touches.delete(event.pointerId)) pinch = touches.size >= 2 ? touchPair() : null;
}
canvas.addEventListener('pointerup', (event) => {
  releaseTouch(event);
  if (!drag || drag.id !== event.pointerId) return;
  const point = localPoint(event);
  if (!drag.moved && drag.floor !== null) choose(drag.floor);
  else if (!drag.moved && active !== null && !transition) showRoom(point);
  drag = null;
  canvas.classList.remove('dragging');
});
canvas.addEventListener('lostpointercapture', (event) => {
  releaseTouch(event);
  if (drag?.id === event.pointerId) drag = null;
  canvas.classList.remove('dragging');
});
canvas.addEventListener('wheel', (event) => {
  if (active === null || transition || floorAt(localPoint(event)) !== null) return;
  event.preventDefault();
  zoom(Math.exp(-event.deltaY * .0019), localPoint(event));
}, { passive: false });
canvas.addEventListener('dblclick', (event) => {
  if (event.pointerType !== 'touch' && active !== null && !transition && floorAt(localPoint(event)) === null) {
    zoom(camera.zoom > 1.2 ? 1 / camera.zoom : 1.56, localPoint(event));
  }
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && active !== null) {
    if (!roomNote.hidden) { hideRoom(); requestDraw(); }
    else choose(null, true);
  }
  if (active === null || transition || document.activeElement !== canvas) return;
  const directions = { ArrowLeft: [25, 0], ArrowRight: [-25, 0], ArrowUp: [0, 25], ArrowDown: [0, -25] };
  if (event.key in directions) {
    event.preventDefault();
    const [x, y] = directions[event.key];
    camera.x += x;
    camera.y += y;
    updateCamera();
  } else if (event.key === '+' || event.key === '=') zoom(1.24);
  else if (event.key === '-') zoom(1 / 1.24);
  else if (event.key === '0') { camera.zoom = 1; camera.x = 0; camera.y = 0; updateCamera(); }
});

new ResizeObserver(resize).observe(canvas);
resize();
</script>
</body>
</html>
